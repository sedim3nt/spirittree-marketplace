<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SpiritTree</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@600&family=Cormorant+Unicase:wght@600&family=Cormorant+Upright:wght@600&display=swap" rel="stylesheet"><style>h1{font-family:'Cormorant Unicase',Georgia,serif;font-weight:600;font-size:clamp(3.125rem,7.5vw,5.5rem)}h2{font-family:'Cormorant Infant',Georgia,serif;font-weight:600;font-size:2.35rem}h3{font-family:'Cormorant Upright',Georgia,serif;font-weight:600;font-size:1.72rem}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f6f7f8;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
:root{
  --sand-50:#f6f7f8;--white:#ffffff;--ink-900:#1a1a2e;--ink-700:#2d2d44;--ink-600:#4a4a5a;--ink-500:#6b6b7a;
  --tide-600:#006ca5;--tide-700:#005a8a;--border-subtle:rgba(26,26,46,0.05);--border-card:rgba(26,26,46,0.1);
  --shadow-card:0 1px 3px rgba(26,26,46,0.08);--radius:4px;--max-w:1152px;
}
header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border-subtle);background:rgba(255,255,255,0.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-wrap{max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
@media(min-width:640px){.nav-wrap{padding:16px 24px}}
.nav-brand{font-size:1.25rem;font-weight:700;color:var(--ink-900)}
.nav-links{display:none;align-items:center;gap:24px;font-size:0.875rem;font-weight:500;color:var(--ink-700)}
@media(min-width:768px){.nav-links{display:flex}}
.nav-links a:hover{color:var(--ink-900)}
.nav-login{border:1px solid rgba(26,26,46,0.4);padding:6px 12px;border-radius:var(--radius);font-size:0.875rem;font-weight:600;color:var(--ink-900)}
.nav-login:hover{border-color:var(--ink-900)}
.hamburger{display:flex;background:none;border:none;color:var(--ink-900);font-size:1.5rem;cursor:pointer}
@media(min-width:768px){.hamburger{display:none}}

.login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.login-card{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius);box-shadow:0 1px 3px rgba(26,26,46,0.08);padding:40px 32px;width:100%;max-width:400px}
.login-card h1{font-size:1.5rem;font-weight:800;color:var(--ink-900);margin-bottom:4px;text-align:center}
.login-card .subtitle{font-size:0.875rem;color:var(--ink-600);text-align:center;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:0.8125rem;font-weight:600;color:var(--ink-700);margin-bottom:6px}
.form-group input{width:100%;border:1px solid var(--border-card);padding:10px 12px;border-radius:var(--radius);font-size:0.875rem;outline:none;font-family:inherit;color:var(--ink-900)}
.form-group input:focus{border-color:var(--tide-600)}
.login-btn{display:block;width:100%;background:var(--tide-600);color:var(--white);font-weight:600;padding:12px 20px;border-radius:var(--radius);font-size:0.9375rem;border:none;cursor:pointer;text-align:center;margin-top:28px;font-family:inherit;transition:background 0.2s}
.login-btn:hover{background:var(--tide-700)}
.login-footer{margin-top:24px;text-align:center;font-size:0.8125rem;color:var(--ink-600)}
.login-footer a{color:var(--tide-600);font-weight:500}

footer{border-top:1px solid var(--border-subtle);background:var(--white);margin-top:auto}
.footer-inner{max-width:var(--max-w);margin:0 auto;padding:40px 24px}
.footer-bottom p{font-size:0.8125rem;color:var(--ink-500);text-align:center}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a class="nav-brand" href="index.html">SpiritTree</a>
    <nav class="nav-links">
      <a href="browse.html">Browse</a>
      <a href="consulting.html">Consulting</a>
      <a href="about.html">About</a>
      <a href="login.html" class="nav-login">Login / Sign Up</a>
    </nav>
    <button class="hamburger" onclick="document.querySelector('.mobile-menu').classList.toggle('open')" aria-label="Menu">&#9776;</button>
  </div>
</header>

<main class="login-page">
  <div class="login-card">
    <h1>Reset password</h1>
    <p class="subtitle">Enter your email and we'll send a reset link</p>
    <div id="msg" style="display:none;padding:10px 12px;border-radius:4px;font-size:0.8125rem;margin-bottom:16px;text-align:center"></div>
    <form onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="login-btn" id="reset-btn">Send Reset Link</button>
    </form>
    <div class="login-footer">
      Remember your password? <a href="login.html">Sign in</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-bottom">
      <p>&copy; 2026 Nrvana LLC</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(
    'https://gnhmveamzymuxlsymsuw.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduaG12ZWFtenltdXhsc3ltc3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MzcwMjEsImV4cCI6MjA4OTExMzAyMX0.cliTxwWBMJXP6U-B-BtFkaUAY857D819f4ekXbkRgpY'
  );

  async function handleReset(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('reset-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://marketplace.spirittree.dev/login.html'
      });
      if (error) throw error;
      msg.style.display = 'block';
      msg.style.background = '#f0fdf4'; msg.style.color = '#166534'; msg.style.border = '1px solid #bbf7d0';
      msg.textContent = 'Check your email for the reset link.';
      btn.textContent = 'Sent!';
    } catch (err) {
      msg.style.display = 'block';
      msg.style.background = '#fef2f2'; msg.style.color = '#991b1b'; msg.style.border = '1px solid #fecaca';
      msg.textContent = err.message;
      btn.textContent = 'Send Reset Link';
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
