<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AgentOrchard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@600&family=Cormorant+Unicase:wght@600&family=Cormorant+Upright:wght@600&display=swap" rel="stylesheet"><style>h1{font-family:'Cormorant Unicase',Georgia,serif;font-weight:600;font-size:clamp(3.125rem,7.5vw,5.5rem)}h2{font-family:'Cormorant Infant',Georgia,serif;font-weight:600;font-size:2.35rem}h3{font-family:'Cormorant Upright',Georgia,serif;font-weight:600;font-size:1.72rem}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#F4EFE6;color:#3A2E20;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
:root{
  /* ── Aesop Design System ── */
  --aesop-parchment:#F4EFE6;
  --aesop-ivory:#EEE8DC;
  --aesop-stone:#D8CEBC;
  --aesop-limestone:#B8AD98;
  --aesop-bark:#7A6A52;
  --aesop-umber:#3A2E20;
  --aesop-dark-earth:#1E1810;
  --aesop-amber:#8B5E3C;
  --aesop-amber-deep:#6B4428;
  --aesop-amber-light:#C89060;
  --aesop-amber-wash:rgba(139,94,60,0.08);
  --font-display:'Cormorant Infant',Georgia,'Times New Roman',serif;
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --sand-50:#F4EFE6;--white:#F4EFE6;--ink-900:#3A2E20;--ink-700:#3A2E20;--ink-600:#7A6A52;--ink-500:#B8AD98;
  --tide-600:#8B5E3C;--tide-700:#6B4428;--border-subtle:rgba(216,206,188,0.6);--border-card:#D8CEBC;
  --tide-light:rgba(139,94,60,0.10);--shadow-card:0 2px 12px rgba(58,46,32,0.06);
  --shadow-card-hover:0 4px 20px rgba(58,46,32,0.10);--radius:4px;--max-w:1152px;
}
header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border-subtle);background:#F4EFE6}
.nav-wrap{max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
@media(min-width:640px){.nav-wrap{padding:16px 24px}}
.nav-brand{font-family:'Cormorant Infant',Georgia,serif;font-size:2.5rem;font-weight:400;letter-spacing:-0.01em;color:var(--ink-900)}
.nav-links{display:none;align-items:center;gap:24px;font-size:0.75rem;font-weight:400;color:var(--ink-700);text-transform:uppercase;letter-spacing:0.15em}
@media(min-width:768px){.nav-links{display:flex}}
.nav-links a:hover{color:var(--ink-900)}
.nav-login{border:1px solid rgba(58,46,32,0.5);padding:6px 12px;border-radius:var(--radius);font-size:0.875rem;font-weight:600;color:var(--ink-900)}
.nav-login:hover{border-color:var(--ink-900)}
.hamburger{display:flex;background:none;border:none;color:var(--ink-900);font-size:1.5rem;cursor:pointer}
@media(min-width:768px){.hamburger{display:none}}
.mobile-menu{display:none;flex-direction:column;gap:16px;padding:16px 24px;background:var(--sand-50);border-bottom:1px solid var(--border-subtle)}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:1rem;color:var(--ink-700);font-weight:500}

/* LOGIN */
.login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.login-card{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:40px 32px;width:100%;max-width:400px}
.login-card h1{font-size:1.5rem;font-weight:300;color:var(--ink-900);margin-bottom:4px;text-align:center}
.login-card .subtitle{font-size:0.875rem;color:var(--ink-600);text-align:center;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:0.8125rem;font-weight:600;color:var(--ink-700);margin-bottom:6px}
.form-group input{width:100%;border:1px solid var(--border-card);padding:10px 12px;border-radius:var(--radius);font-size:0.875rem;outline:none;font-family:inherit;color:var(--ink-900)}
.form-group input:focus{border-color:var(--tide-600)}
.forgot{display:block;text-align:right;font-size:0.8125rem;color:var(--tide-600);font-weight:500;margin-top:8px}
.forgot:hover{color:var(--tide-700)}
.login-btn{display:block;width:100%;background:var(--tide-600);color:var(--white);font-weight:600;padding:12px 20px;border-radius:var(--radius);font-size:0.9375rem;border:none;cursor:pointer;text-align:center;margin-top:28px;font-family:inherit;transition:background 0.2s}
.login-btn:hover{background:var(--tide-700)}
.login-footer{margin-top:24px;text-align:center;font-size:0.8125rem;color:var(--ink-600)}
.login-footer a{color:var(--tide-600);font-weight:500}
.login-footer a:hover{color:var(--tide-700)}

/* FOOTER */
footer{border-top:1px solid var(--border-subtle);background:var(--white)}
.footer-inner{max-width:var(--max-w);margin:0 auto;padding:40px 24px}
.footer-bottom p{font-size:0.8125rem;color:var(--ink-500);text-align:center}

/* Aesop Global Overrides */
body{background:#F4EFE6;color:#3A2E20;font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.8}
h1,h2,h3,h4,h5,h6{font-family:'Cormorant Infant',Georgia,serif;font-weight:400;color:#3A2E20;text-transform:lowercase;letter-spacing:-0.01em;line-height:1.2}
header{background:rgba(244,239,230,0.97) !important;border-bottom:1px solid #D8CEBC !important;backdrop-filter:blur(8px)}
.mobile-menu,.mm{background:#F4EFE6 !important}
.card,.pc{background:#EEE8DC !important;border:1px solid #D8CEBC !important}
.card:hover{background:#EEE8DC !important;box-shadow:0 4px 20px rgba(58,46,32,0.10) !important}
.card-tag{background:rgba(244,239,230,0.8) !important;border-color:#D8CEBC !important;color:#7A6A52 !important}
.btn-primary,.card-btn,.pbtn,.nl-btn{background:#8B5E3C !important;color:#F4EFE6 !important;border-radius:4px !important;letter-spacing:0.05em}
.btn-primary:hover,.card-btn:hover,.pbtn:hover,.nl-btn:hover{background:#6B4428 !important}
.btn-outline{border:1px solid #D8CEBC !important;color:#3A2E20 !important;border-radius:4px !important}
.btn-outline:hover{background:#EEE8DC !important;border-color:#B8AD98 !important}
.nav-login,.nli{background:#8B5E3C !important;color:#F4EFE6 !important;border:none !important;border-radius:4px !important}
.nav-login:hover,.nli:hover{background:#6B4428 !important}
.nl-input{background:#F4EFE6 !important;border-color:#D8CEBC !important;color:#3A2E20 !important}
.nl-input:focus{border-color:#8B5E3C !important;outline:none}
.step-num{background:rgba(139,94,60,0.10) !important;color:#8B5E3C !important}
.products,.how,.stats{background:#F4EFE6 !important}
.hero,.newsletter{background:#F4EFE6 !important}
.cat,.card-cat,.pm .cat,.bl{color:#8B5E3C !important}
.stat h2{color:#3A2E20 !important}
.hero h1,.section-head h2,.how h2,.newsletter h2,.pm h1,.step h3,.stat h2{font-family:'Cormorant Infant',Georgia,serif !important;font-weight:300 !important;text-transform:lowercase !important}
.nav-brand,.nb{font-family:'Cormorant Infant',Georgia,serif !important;font-weight:400 !important;color:#3A2E20 !important;letter-spacing:-0.01em}
select,input,textarea{background:#F4EFE6 !important;border-color:#D8CEBC !important;color:#3A2E20 !important}
select:focus,input:focus,textarea:focus{border-color:#8B5E3C !important;outline:none}

/* Aesop footer dark */
footer{background:#1E1810 !important;border-top:none !important}
footer *,.fi,.footer-inner,.fbot,.footer-bottom,.fc,.footer-col{color:#EEE8DC !important}
footer a,.fc nav a,.footer-col nav a{color:#B8AD98 !important}
footer a:hover,.fc nav a:hover,.footer-col nav a:hover{color:#EEE8DC !important}
.footer-bottom p,.fbot p{color:#7A6A52 !important;border-top-color:rgba(216,206,188,0.15) !important}
.fbot{border-top-color:rgba(216,206,188,0.15) !important}
.footer-bottom{border-top-color:rgba(216,206,188,0.15) !important}

</head>
<body>

<header>
  <div class="nav-wrap">
    <a class="nav-brand" href="index.html">Agent Orchard</a>
    <nav class="nav-links">
      <a href="browse.html">Browse</a>
      <a href="consulting.html">Consulting</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="tools.html">Tools</a>
      <a href="login.html" class="nav-login">Login / Sign Up</a>
    </nav>
    <button class="hamburger" onclick="document.querySelector('.mobile-menu').classList.toggle('open')" aria-label="Menu">&#9776;</button>
  </div>
</header>
<div class="mobile-menu">
  <a href="browse.html">Browse</a>
  <a href="consulting.html">Consulting</a>
  <a href="about.html">About</a>
  <a href="blog.html">Blog</a>
  <a href="tools.html">Tools</a>
  <a href="login.html">Login / Sign Up</a>
</div>

<main class="login-page">
  <div class="login-card">
    <h1>Account access</h1>
    <p class="subtitle">One account for buyers and creators</p>
    <div id="auth-message" style="display:none;padding:10px 12px;border-radius:var(--radius);font-size:0.8125rem;margin-bottom:16px;text-align:center"></div>

    <!-- Sign In / Sign Up Tabs -->
    <div style="display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border-card);border-radius:var(--radius);overflow:hidden">
      <button id="tab-signin" onclick="showTab('signin')" style="flex:1;padding:8px;font-size:0.8125rem;font-weight:600;border:none;cursor:pointer;background:var(--tide-600);color:white;font-family:inherit">Sign In</button>
      <button id="tab-signup" onclick="showTab('signup')" style="flex:1;padding:8px;font-size:0.8125rem;font-weight:600;border:none;cursor:pointer;background:var(--white);color:var(--ink-700);font-family:inherit">Create Account</button>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
        <a href="forgot-password.html" class="forgot" id="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="login-btn" id="auth-btn">Sign In</button>
    </form>
    <div class="login-footer">
      Looking for products? <a href="browse.html">Browse marketplace</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://gnhmveamzymuxlsymsuw.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduaG12ZWFtenltdXhsc3ltc3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MzcwMjEsImV4cCI6MjA4OTExMzAyMX0.cliTxwWBMJXP6U-B-BtFkaUAY857D819f4ekXbkRgpY';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let mode = 'signin';

      function showTab(tab) {
        mode = tab;
        const si = document.getElementById('tab-signin');
        const su = document.getElementById('tab-signup');
        const btn = document.getElementById('auth-btn');
        const forgot = document.getElementById('forgot-link');
        if (tab === 'signin') {
          si.style.background = 'var(--tide-600)'; si.style.color = 'white';
          su.style.background = 'var(--white)'; su.style.color = 'var(--ink-700)';
          btn.textContent = 'Sign In';
          forgot.style.display = '';
        } else {
          su.style.background = 'var(--tide-600)'; su.style.color = 'white';
          si.style.background = 'var(--white)'; si.style.color = 'var(--ink-700)';
          btn.textContent = 'Create Account';
          forgot.style.display = 'none';
        }
        hideMessage();
      }

      function showMessage(text, isError) {
        const el = document.getElementById('auth-message');
        el.style.display = 'block';
        el.textContent = text;
        el.style.background = isError ? '#fef2f2' : '#f0fdf4';
        el.style.color = isError ? '#991b1b' : '#166534';
        el.style.border = isError ? '1px solid #fecaca' : '1px solid #bbf7d0';
      }

      function hideMessage() {
        document.getElementById('auth-message').style.display = 'none';
      }

      async function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('auth-btn');
        btn.disabled = true;
        btn.textContent = mode === 'signin' ? 'Signing in...' : 'Creating account...';

        try {
          if (mode === 'signup') {
            const { data, error } = await sb.auth.signUp({ email, password });
            if (error) throw error;
            showMessage('Check your email to confirm your account.', false);
            btn.textContent = 'Create Account';
          } else {
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            showMessage('Signed in! Redirecting...', false);
            setTimeout(() => window.location.href = 'account.html', 1000);
            return;
          }
        } catch (err) {
          showMessage(err.message || 'Something went wrong', true);
          btn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
        }
        btn.disabled = false;
      }

      // Check if already logged in
      (async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (session) window.location.href = 'account.html';
      })();
    </script>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-bottom">
      <p>&copy; 2026 Nrvana LLC</p>
    </div>
  </div>
</footer>
