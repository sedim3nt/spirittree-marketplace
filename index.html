<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentOrchard — AI Operations Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@600&family=Cormorant+Unicase:wght@600&family=Cormorant+Upright:wght@600&display=swap" rel="stylesheet"><style>h1{font-family:'Cormorant Unicase',Georgia,serif;font-weight:600;font-size:clamp(3.125rem,7.5vw,5.5rem)}h2{font-family:'Cormorant Infant',Georgia,serif;font-weight:600;font-size:2.35rem}h3{font-family:'Cormorant Upright',Georgia,serif;font-weight:600;font-size:1.72rem}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f6f7f8;color:#1a1a2e}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* DESIGN TOKENS */
:root{
  --sand-50:#f6f7f8;
  --white:#ffffff;
  --ink-900:#1a1a2e;
  --ink-700:#2d2d44;
  --ink-600:#4a4a5a;
  --ink-500:#6b6b7a;
  --tide-600:#006ca5;
  --tide-700:#005a8a;
  --border-subtle:rgba(26,26,46,0.05);
  --border-card:rgba(26,26,46,0.1);
  --tide-light:rgba(13,148,136,0.1);
  --shadow-card:0 1px 3px rgba(26,26,46,0.08);
  --shadow-card-hover:0 4px 16px rgba(26,26,46,0.12);
  --radius:4px;
  --max-w:1152px;
}

/* NAV */
header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border-subtle);background:#ffffff}
.nav-wrap{max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
@media(min-width:640px){.nav-wrap{padding:16px 24px}}
.nav-brand{font-family:'Cormorant Infant',Georgia,serif;font-size:2.5rem;font-weight:600;color:var(--ink-900)}
.nav-links{display:none;align-items:center;gap:24px;font-size:0.875rem;font-weight:500;color:var(--ink-700)}
@media(min-width:768px){.nav-links{display:flex}}
.nav-links a:hover{color:var(--ink-900)}
.nav-login{border:1px solid rgba(26,26,46,0.4);padding:6px 12px;border-radius:var(--radius);font-size:0.875rem;font-weight:600;color:var(--ink-900)}
.nav-login:hover{border-color:var(--ink-900)}
.hamburger{display:flex;background:none;border:none;color:var(--ink-900);font-size:1.5rem;cursor:pointer}
@media(min-width:768px){.hamburger{display:none}}
.mobile-menu{display:none;flex-direction:column;gap:16px;padding:16px 24px;background:var(--sand-50);border-bottom:1px solid var(--border-subtle)}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:1rem;color:var(--ink-700);font-weight:500}
.mobile-menu a:hover{color:var(--ink-900)}

/* HERO */
.hero{padding:64px 24px;background:var(--white)}
.hero-inner{max-width:var(--max-w);margin:0 auto;display:grid;grid-template-columns:2fr 3fr;gap:48px;align-items:center}
.hero-copy{text-align:left}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;color:var(--ink-900);line-height:1.1;margin-bottom:16px;letter-spacing:-0.02em}
.hero p{font-size:1.125rem;color:var(--ink-600);line-height:1.6;max-width:560px;margin:0 0 32px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-img{width:100%;border-radius:var(--radius)}
.hero-img img{width:100%;height:auto;border-radius:var(--radius);display:block}
.btn-primary{background:var(--tide-600);color:var(--white);font-weight:600;padding:12px 24px;border-radius:var(--radius);font-size:0.875rem;transition:background 0.2s}
.btn-primary:hover{background:var(--tide-700)}
.btn-outline{border:1px solid var(--border-card);color:var(--ink-900);font-weight:600;padding:12px 24px;border-radius:var(--radius);font-size:0.875rem;transition:all 0.2s}
.btn-outline:hover{background:var(--ink-900);color:var(--white);border-color:var(--ink-900)}

/* STATS STRIP */
.stats{padding:48px 24px;background:var(--white);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.stats-inner{max-width:var(--max-w);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center}
.stat h2{font-size:2.35rem;font-weight:600;color:var(--ink-900);margin-bottom:4px}
.stat p{font-size:0.875rem;color:var(--ink-600)}

/* PRODUCTS */
.products{padding:64px 24px;background:var(--sand-50)}
.products-inner{max-width:var(--max-w);margin:0 auto}
.section-head{margin-bottom:32px}
.section-head h2{font-size:2.35rem;font-weight:700;color:var(--ink-900);margin-bottom:4px}
.section-head p{font-size:0.875rem;color:var(--ink-600)}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

/* PRODUCT CARD */
.card{display:flex;flex-direction:column;border:1px solid var(--border-subtle);background:var(--white);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow-card);transition:box-shadow 0.2s}
.card:hover{box-shadow:var(--shadow-card-hover)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-info{display:flex;align-items:center;gap:12px}
.card-icon{display:none}
.card-name{font-weight:600;color:var(--ink-900);font-size:1.5rem;line-height:1}
.card-cat{font-size:0.8125rem;color:var(--ink-600)}
.card-price{font-size:1.125rem;font-weight:700;color:var(--ink-900);white-space:nowrap}
.card-desc{margin-top:16px;font-size:0.875rem;line-height:1.6;color:var(--ink-600);flex:1}
.card-tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.card-tag{background:rgba(250,248,245,1);border:1px solid var(--border-subtle);padding:2px 8px;border-radius:var(--radius);font-size:0.75rem;font-weight:500;color:var(--ink-700)}
.card-bottom{margin-top:20px;border-top:1px solid var(--border-subtle);padding-top:16px;display:flex;align-items:center;justify-content:space-between}
.card-creator{display:none;font-size:0.75rem;color:var(--ink-500);background:var(--sand-50);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:3px 8px;white-space:nowrap;flex-shrink:0}
.card-btn{background:var(--tide-600);color:var(--white);border-radius:var(--radius);padding:6px 14px;font-weight:600;font-size:0.8125rem;transition:background 0.2s}
.card-btn:hover{background:var(--tide-700)}

/* NEWSLETTER */
.newsletter{padding:64px 24px;background:var(--white);text-align:center}
.newsletter-inner{max-width:480px;margin:0 auto}
.newsletter h2{font-size:2.35rem;font-weight:700;color:var(--ink-900);margin-bottom:8px}
.newsletter p{font-size:0.875rem;color:var(--ink-600);line-height:1.6;margin-bottom:24px}
.nl-form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nl-input{border:1px solid var(--border-card);padding:10px 14px;border-radius:var(--radius);font-size:0.875rem;flex:1;min-width:200px;outline:none}
.nl-input:focus{border-color:var(--tide-600)}
.nl-btn{background:var(--tide-600);color:var(--white);font-weight:600;padding:10px 20px;border-radius:var(--radius);font-size:0.875rem;border:none;cursor:pointer;transition:background 0.2s}
.nl-btn:hover{background:var(--tide-700)}

/* HOW IT WORKS */
.how{padding:64px 24px;background:var(--sand-50)}
.how-inner{max-width:var(--max-w);margin:0 auto}
.how h2{font-size:2.35rem;font-weight:700;color:var(--ink-900);margin-bottom:8px;text-align:center}
.how>p,.how-inner>p{text-align:center;color:var(--ink-600);font-size:0.875rem;margin-bottom:40px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.step{text-align:center}
.step-num{width:48px;height:48px;border-radius:var(--radius);background:var(--tide-light);color:var(--tide-600);font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.step h3{font-size:1.72rem;font-weight:700;color:var(--ink-900);margin-bottom:6px}
.step p{font-size:0.875rem;color:var(--ink-600);line-height:1.5}

/* DARK CTA BAND */
.cta-band{padding:64px 24px;background:var(--ink-900);text-align:center}
.cta-band h2{font-size:2.35rem;font-weight:700;color:var(--white);margin-bottom:8px}
.cta-band p{color:rgba(255,255,255,0.65);font-size:0.875rem;margin-bottom:24px}
.cta-band .btn-primary{background:var(--tide-600);padding:14px 28px;font-size:1rem}

/* FOOTER */
footer{border-top:1px solid var(--border-subtle);background:var(--white)}
.footer-inner{max-width:var(--max-w);margin:0 auto;padding:40px 24px}
.footer-grid{display:grid;gap:40px;grid-template-columns:3fr 2fr}
.footer-col p.footer-brand{font-size:0.875rem;font-weight:700;color:var(--ink-900);margin-bottom:12px}
.footer-col nav{display:flex;flex-direction:column;gap:8px}
.footer-col nav a{font-size:0.875rem;color:var(--ink-600);transition:color 0.2s}
.footer-col nav a:hover{color:var(--ink-900)}
.footer-col.products-col nav{columns:2;column-gap:32px}
.footer-col.products-col nav a{display:block;margin-bottom:8px}
.footer-bottom{margin-top:32px;border-top:1px solid var(--border-subtle);padding-top:24px}
.footer-bottom p{font-size:0.8125rem;color:var(--ink-500)}

/* RESPONSIVE */
@media(max-width:900px){
  .card-grid{grid-template-columns:repeat(2,1fr)}
  .stats-inner{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .card-grid{grid-template-columns:1fr}
  .stats-inner{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .hero{padding:48px 20px}
  .hero-inner{grid-template-columns:1fr}
  .hero-copy{text-align:center}
  .hero p{margin:0 auto 32px}
  .hero-btns{justify-content:center}
  .hero-img{max-width:400px;margin:0 auto}
}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    
          
        </nav>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Nrvana LLC</p>
    </div>
  </div>
</footer>

</body>
</html>
